server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Liveness do container
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Assets com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Nunca cachear o HTML de entrada nem o service worker do MSW
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
    }

    # Opcional: se o back-end estiver na mesma origem, descomente e ajuste o upstream
    # (e deixe VITE_API_URL vazio no build).
    # location /api/ {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # Fallback de SPA: rotas do React Router (/medicamentos, /unidades/123...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
